<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 9 - Physics Simulations</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <h1>Code lab 9 — Multi-Body Browser Simulation </h1>
      <section class="simulation-layout">
        <section class="controls" aria-label="Simulation controls">
          <label>Scene
            <select id="scene"></select>
          </label>
          <label>Integrator
            <select id="integrator">
              <option value="verlet">Velocity Verlet</option>
              <option value="euler">Euler-Cromer</option>
            </select>
          </label>
          <label>e = <output id="restitution-value">0.80</output>
            <input id="restitution" type="range" min="0" max="1" step="0.05" value="0.8">
          </label>
          <label>Number of Bodies
            <select id="body-count">
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200">200</option>
            </select>
          </label>
        </section>
        <canvas id="simulation" width="1100" height="650" aria-label="Physics simulation"></canvas>
        <aside class="hud-panel" aria-label="Simulation HUD">
          <h2>Conservation HUD</h2>
          <div id="hud" aria-live="polite"></div>
        </aside>
      </section>
      <section class="readouts">
        <div>
          <h2>Conservation Checks</h2>
          <button id="run-checks" type="button">Run Checks</button>
          <pre id="checks" aria-live="polite">Select a scene. The checks compare isolated pair collisions, softened gravity, and a spring network.</pre>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
